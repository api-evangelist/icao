apis:
- aid: icao:icao-states-api
  name: ICAO States API
  description: >-
    Endpoints providing reference and statistical data on ICAO Member States, including state-level aviation
    activity, agreements, and contracting state metadata.
  humanURL: https://applications.icao.int/dataservices/default.aspx
  tags:
  - States
  - Reference Data
  properties:
  - type: Documentation
    url: https://www.icao.int/safety/iStars/Pages/API-Data-Service.aspx
- aid: icao:icao-airports-api
  name: ICAO Airports API
  description: >-
    Endpoints exposing ICAO airport reference data including DOC7910 location indicators, airport metadata,
    and related aerodrome information.
  humanURL: https://applications.icao.int/dataservices/default.aspx
  tags:
  - Airports
  - DOC7910
  - Reference Data
  properties:
  - type: Documentation
    url: https://www.icao.int/safety/iStars/Pages/API-Data-Service.aspx
- aid: icao:icao-operators-api
  name: ICAO Operators API
  description: >-
    Endpoints providing operator reference data including DOC8585 three-letter operator designators, telephony,
    and operator details for airlines and aircraft operators.
  humanURL: https://applications.icao.int/dataservices/default.aspx
  tags:
  - DOC8585
  - Operator
  - Reference Data
  tags_raw:
  - DOC8585
  - Operators
  - Reference Data
  properties:
  - type: Documentation
    url: https://www.icao.int/safety/iStars/Pages/API-Data-Service.aspx
- aid: icao:icao-airspace-api
  name: ICAO Airspace API
  description: >-
    Endpoints providing airspace, navigation, and route data including flight information regions and
    airspace structures relevant to international air navigation.
  humanURL: https://applications.icao.int/dataservices/default.aspx
  tags:
  - Airspace
  - Navigation
  properties:
  - type: Documentation
    url: https://www.icao.int/safety/iStars/Pages/API-Data-Service.aspx
- aid: icao:icao-occurrences-api
  name: ICAO Occurrences API
  description: >-
    Endpoints providing access to aviation safety occurrence data, including accident and incident records
    reported through ICAO's safety information systems.
  humanURL: https://applications.icao.int/dataservices/default.aspx
  tags:
  - Accidents
  - Incidents
  - Safety
  properties:
  - type: Documentation
    url: https://www.icao.int/safety/iStars/Pages/API-Data-Service.aspx
- aid: icao:icao-aircraft-api
  name: ICAO Aircraft API
  description: >-
    Endpoints providing aircraft reference data including DOC8643 aircraft type designators, manufacturer
    information, and aircraft performance categories.
  humanURL: https://applications.icao.int/dataservices/default.aspx
  tags:
  - Aircraft
  - DOC8643
  - Reference Data
  properties:
  - type: Documentation
    url: https://www.icao.int/safety/iStars/Pages/API-Data-Service.aspx
- aid: icao:icao-store-graphql
  name: ICAO Store GraphQL API
  description: >-
    The GraphQL API behind the ICAO Store (store.icao.int), where ICAO sells publications and API Data
    Service plans and booster packs. Anonymous introspection is open and returns a Magento (Adobe Commerce)
    storefront schema with 57 query fields and 166 mutations covering catalog, cart, checkout and customer
    accounts.
  humanURL: https://store.icao.int/
  baseURL: https://store.icao.int/graphql
  tags:
  - Commerce
  - GraphQL
  properties:
  - type: GraphQL
    url: graphql/icao-store-introspection.json
