aid: icao
name: ICAO
description: The International Civil Aviation Organization (ICAO) is a specialized agency of the United
  Nations that codifies the principles and techniques of international air navigation and fosters the
  planning and development of international air transport. ICAO's API Data Service provides 50+ continuously
  updated APIs covering states, airports, operators, airspace, occurrences, and aircraft, including official
  reference datasets such as DOC7910 location indicators, DOC8585 operator three-letter codes, and DOC8643
  aircraft type designators.
